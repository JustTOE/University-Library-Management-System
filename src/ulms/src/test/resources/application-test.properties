spring.datasource.url=jdbc:h2:mem:ulms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-h2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
ulms.security.jwt.secret=test-secret-32-bytes-long-padding-padding-padding
ulms.security.jwt.lifetime-minutes=60
ulms.security.cors.allowed-origin=http://localhost:5173
ulms.scheduler.fine-cron=-
ulms.scheduler.notification-cron=-
ulms.scheduler.zone=UTC
ulms.mail.enabled=false
spring.mail.host=localhost
spring.mail.port=3025
spring.main.allow-bean-definition-overriding=true
