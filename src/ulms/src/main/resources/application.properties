spring.application.name=ulms

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5431/ulms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:db_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:db_password}

# Flyway
spring.flyway.clean-disabled=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Security
ulms.security.jwt.secret=${JWT_SECRET:}
ulms.security.jwt.lifetime-minutes=${JWT_LIFETIME_MINUTES:60}
ulms.security.cors.allowed-origin=${ULMS_FRONTEND_ORIGIN:http://localhost:5173}

# Scheduling
ulms.scheduler.fine-cron=0 0 2 * * *
ulms.scheduler.zone=Europe/Bucharest
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=ulms-sched-
