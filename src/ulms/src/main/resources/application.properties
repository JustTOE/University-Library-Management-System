spring.application.name=ulms

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5431/ulms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:db_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:db_password}

# Flyway
spring.flyway.clean-disabled=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Security
# Dev/local convenience default so the app boots from an IDE without setup.
# The prod profile (application-prod.properties) overrides this with an empty
# default so production fails closed unless JWT_SECRET is set. Never rely on
# this committed key outside local development.
ulms.security.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-for-local-32-byte-min}
ulms.security.jwt.lifetime-minutes=${JWT_LIFETIME_MINUTES:60}
ulms.security.cors.allowed-origin=${ULMS_FRONTEND_ORIGIN:http://localhost:5173}

# Fines
# Flat replacement fee charged when a student reports a borrowed book as lost
# (added on top of any accrued overdue fine). Tunable without a redeploy.
ulms.fine.lost-book-fee=${ULMS_LOST_BOOK_FEE:50.00}

# Scheduling
ulms.scheduler.fine-cron=0 0 2 * * *
ulms.scheduler.notification-cron=0 5 2 * * *
ulms.scheduler.zone=Europe/Bucharest
ulms.scheduler.due-reminder-days-ahead=3
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=ulms-sched-

# Mail
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
ulms.mail.from=${MAIL_FROM:no-reply@ulms.local}
ulms.mail.enabled=${ULMS_MAIL_ENABLED:true}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=ULMS Backend
info.app.version=@project.version@

# Springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Structured logging (Spring Boot 4 native ECS format)
logging.structured.format.console=ecs
logging.structured.ecs.service.name=ulms-backend
logging.structured.ecs.service.version=@project.version@
