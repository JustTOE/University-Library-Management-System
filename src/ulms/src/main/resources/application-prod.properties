# Profile: prod
# Activated via SPRING_PROFILES_ACTIVE=prod (see docker-compose.prod.yml).

# Security: fail closed. Override the base dev fallback with an empty default so
# prod refuses to start unless JWT_SECRET is provided — a committed signing key
# must never be usable in production.
ulms.security.jwt.secret=${JWT_SECRET:}

# Flyway: never allow clean in production.
spring.flyway.clean-disabled=true

# JPA: validate schema only — never auto-mutate prod.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Tomcat: modest pool sized for a single VPS; bumped from default to cover the daily scheduler bursts.
server.tomcat.threads.max=100
server.tomcat.accept-count=50
server.tomcat.connection-timeout=20s

# Actuator: only health is public; the rest still require an authenticated ADMIN (controlled by SecurityConfig).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# Springdoc: keep /v3/api-docs reachable for the Next.js types:api regen, but hide the Swagger UI in prod.
springdoc.swagger-ui.enabled=false

# Logging: ECS structured logs to stdout (already enabled in base properties); silence chatty Hibernate SQL.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.web=WARN

# Error responses: never leak stack traces.
server.error.include-stacktrace=never
server.error.include-message=always
